server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão exata do nginx nas respostas e páginas de erro.
    server_tokens off;

    # --- Cabeçalhos de segurança (Escopo 13) ---------------------------------
    #
    # A CSP é a defesa em profundidade contra XSS: mesmo que algum dia entre
    # uma injeção no bundle, o navegador recusa executar script de outra
    # origem e recusa exfiltrar dados para um host que não esteja em
    # `connect-src`. O bundle do Vite é todo servido de arquivos próprios, sem
    # CDN, então `'self'` cobre scripts e estilos.
    #
    # `connect-src` precisa listar a API (outra porta = outra origem para a
    # CSP). Ajuste junto com VITE_API_URL se apontar para outro host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3000; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Clickjacking: ninguém embute esta app num iframe (redundante com
    # frame-ancestors, mantido para navegadores antigos).
    add_header X-Frame-Options "DENY" always;
    # Impede o navegador de "adivinhar" o tipo de um arquivo e executar como
    # script algo servido como texto.
    add_header X-Content-Type-Options "nosniff" always;
    # Não vaza a URL interna (que pode conter ids) para sites externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # SPA: qualquer rota desconhecida cai no index.html (React Router, se usado)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
